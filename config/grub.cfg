set default=0
set timeout=3
set timeout_style=menu
set menu_color_normal=light-gray/black
set menu_color_highlight=white/red
set tinyhat_arch=i686
source $prefix/arch.cfg
set cpu_ok=1
if [ "$tinyhat_arch" = x86_64 ]; then
  if ! cpuid -l; then
    set cpu_ok=
    set timeout=-1
    echo "This is the 64-bit version of Tiny Hat, but this PC has a 32-bit CPU."
    echo "Please write tinyhat32.img to the USB stick instead."
    echo ""
    echo "Press Esc to continue (or wait 30 seconds)."
    sleep --interruptible 30
  fi
fi
set theme_dir=/boot/grub/themes/tinyhat
source $theme_dir/theme.cfg

if [ -n "$cpu_ok" ]; then
set th_mid=none
set th_env=
set gfx_args=
smbios --type 1 --get-uuid 8 --set th_mid
if regexp --set=1 th_disk '^([^,]+),' "$root" && [ -f "($th_disk,msdos1)/tinyhat/grubenv" ]; then
  set th_env="($th_disk,msdos1)/tinyhat/grubenv"
  load_env -f "$th_env" th_mode gfx_pending gfx_basic
  if [ "$gfx_pending" = "$th_mid" ]; then
    set gfx_basic="$gfx_basic,$th_mid"
    set gfx_pending=
    save_env -f "$th_env" gfx_pending gfx_basic
  fi
  if regexp "$th_mid" "$gfx_basic"; then
    set gfx_args=nomodeset
  fi
  if [ -n "$th_mode" ]; then
    set default="$th_mode"
  fi
fi
export th_mid th_env gfx_args

function tinyhat {
  if [ -n "$th_env" ]; then
    set th_mode="$1"
    save_env -f "$th_env" th_mode
  fi
  if [ -z "$gfx_args" ]; then
    set gfxpayload=keep
    if [ -n "$th_env" ]; then
      set gfx_pending="$th_mid"
      save_env -f "$th_env" gfx_pending
    fi
  elif [ -n "$theme" ]; then
    set gfxpayload=keep
  else
    set gfxpayload=800x600x32,800x600x16,800x600,auto
  fi
  linux /boot/vmlinuz quiet loglevel=3 systemd.show_status=error rd.udev.log_level=3 tinyhat.label=TINYHAT tinyhat.persist=$1 $gfx_args
  initrd /boot/initramfs.img
}

menuentry "Tiny Hat, save config to this memory stick" --id stick {
  tinyhat stick
}
menuentry "Tiny Hat, save config to this machine" --id machine {
  tinyhat machine
}
menuentry "Tiny Hat, leave no trace" --id none {
  tinyhat none
}
if [ -n "$gfx_args" ]; then
menuentry "Tiny Hat, try full graphics again" {
  set gfx_basic=
  save_env -f "$th_env" gfx_basic
  set gfx_args=
  tinyhat "$th_mode"
}
fi
menuentry "Tiny Hat, safe mode" {
  set gfxpayload=800x600x32,800x600x16,800x600,auto
  linux /boot/vmlinuz tinyhat.label=TINYHAT tinyhat.persistlog nomodeset memtest=4 console=ttyS0,115200 console=tty0
  initrd /boot/initramfs.img
}
fi
if [ "$grub_platform" != efi ]; then
menuentry "Memory test (Memtest86+)" {
  linux16 /boot/memtest86+/memtest.bin
}
fi
menuentry "Boot the internal hard disk" {
  if [ "$grub_platform" = efi ]; then
    exit
  fi
  set root=(hd1)
  chainloader +1
}
if [ -z "$cpu_ok" ]; then
menuentry "Power off" {
  halt
}
fi
