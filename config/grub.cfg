set default=0
set timeout=3
set timeout_style=menu
set menu_color_normal=light-gray/black
set menu_color_highlight=white/red
set tinyhat_arch=i686
source $prefix/arch.cfg
set th_serial=ttyS0
if [ "$tinyhat_arch" = aarch64 ]; then
  set th_serial=ttyAMA0
fi
export th_serial
set cpu_ok=1
if [ "$tinyhat_arch" = x86_64 ]; then
  if ! cpuid -l; then
    set cpu_ok=
    set timeout=-1
    echo "This is the 64-bit version of Tiny Hat, but this PC has a 32-bit CPU."
    echo "Please write tinyhat32.img to the USB stick instead."
    echo ""
    echo "Press Esc to continue (or wait 30 seconds)."
    sleep --interruptible 30
  fi
fi
set theme_dir=/boot/grub/themes/tinyhat
source $theme_dir/theme.cfg

if [ -n "$cpu_ok" ]; then
set th_env=
set th_disk=
set th_cpu=
set th_vendor=
smbios --type 4 --get-string 7 --set th_vendor
if regexp 'AMD|Advanced Micro' "$th_vendor"; then
  set th_cpu=amd
elif regexp '[Ii]ntel' "$th_vendor"; then
  set th_cpu=intel
fi
regexp --set=th_disk '^([^,]+),' "$root"
if [ -n "$th_disk" -a -f "($th_disk,msdos1)/tinyhat/grubenv" ]; then
  set th_env="($th_disk,msdos1)/tinyhat/grubenv"
  load_env -f "$th_env" th_mode th_cmdline
fi
if [ -n "$th_mode" ]; then
  set default="$th_mode"
fi
if [ -z "$th_mode" ]; then
  set th_mode=stick
fi
export th_env th_mode th_cpu th_cmdline
fi
# In a virtual machine (VirtualBox, QEMU/KVM, VMware, Hyper-V, Parallels, Xen) Tiny Hat is on a disk drive, not a memory stick
set th_media="memory stick"
set th_sys=
set th_product=
smbios --type 1 --get-string 4 --set th_sys
smbios --type 1 --get-string 5 --set th_product
if regexp 'innotek|VirtualBox|QEMU|VMware|Parallels|Xen|Bochs' "$th_sys $th_product"; then
  set th_media="disk drive"
elif regexp 'Microsoft' "$th_sys"; then
  if regexp 'Virtual Machine' "$th_product"; then
    set th_media="disk drive"
  fi
fi

function th_initrd {
  if [ "$tinyhat_arch" = aarch64 ]; then
    initrd /boot/initramfs.img
  elif [ "$th_cpu" = amd ]; then
    initrd /boot/amd-ucode.img /boot/initramfs.img
  elif [ "$th_cpu" = intel ]; then
    initrd /boot/intel-ucode.img /boot/initramfs.img
  else
    initrd /boot/amd-ucode.img /boot/intel-ucode.img /boot/initramfs.img
  fi
}

function tinyhat {
  if [ -n "$th_env" ]; then
    save_env -f "$th_env" th_mode
  fi
  set gfxpayload=keep
  linux /boot/vmlinuz vt.global_cursor_default=0 quiet loglevel=3 systemd.show_status=error rd.udev.log_level=3 tinyhat.label=TINYHAT tinyhat.persist=$th_mode $th_cmdline
  th_initrd
}

# Started from a CD or an .iso file (also when written to a memory stick), nothing can be saved
if [ -n "$cpu_ok" -a -n "$th_iso" ]; then
menuentry "Tiny Hat" --id none {
  set th_mode=none
  tinyhat
}
fi
if [ -n "$cpu_ok" -a -z "$th_iso" ]; then
menuentry "Tiny Hat, save config to this $th_media" --id stick {
  set th_mode=stick
  tinyhat
}
menuentry "Tiny Hat, save config to this machine" --id machine {
  set th_mode=machine
  tinyhat
}
menuentry "Tiny Hat, leave no trace" --id none {
  set th_mode=none
  tinyhat
}
fi
if [ -n "$cpu_ok" ]; then
menuentry "Tiny Hat, safe mode" {
  set gfxpayload=keep
  linux /boot/vmlinuz vt.global_cursor_default=0 tinyhat.label=TINYHAT tinyhat.persistlog memtest=4 nomodeset console=$th_serial,115200 console=tty0 $th_cmdline
  th_initrd
}
menuentry "Orbiton" --id orbiton {
  set gfxpayload=keep
  linux /boot/vmlinuz vt.global_cursor_default=0 quiet loglevel=3 systemd.show_status=error rd.udev.log_level=3 tinyhat.label=TINYHAT tinyhat.persist=$th_mode init=/usr/lib/tinyhat/orbiton-init O_THEME=blueedit $th_cmdline
  th_initrd
}
fi
if [ "$grub_platform" != efi ]; then
menuentry "Memory test (Memtest86+)" {
  linux16 /boot/memtest86+/memtest.bin
}
fi
menuentry "Boot the internal hard disk" {
  if [ "$grub_platform" = efi ]; then
    exit
  fi
  set root=(hd1)
  chainloader +1
}
if [ -z "$cpu_ok" ]; then
menuentry "Power off" {
  halt
}
fi
