set default=0
set timeout=3
set timeout_style=menu
set menu_color_normal=light-gray/black
set menu_color_highlight=white/red
set tinyhat_arch=i686
source $prefix/arch.cfg
set cpu_ok=1
if [ "$tinyhat_arch" = x86_64 ]; then
  if ! cpuid -l; then
    set cpu_ok=
    set timeout=-1
    echo "This is the 64-bit version of Tiny Hat, but this PC has a 32-bit CPU."
    echo "Please write tinyhat32.img to the USB stick instead."
    echo ""
    echo "Press Esc to continue (or wait 30 seconds)."
    sleep --interruptible 30
  fi
fi
set theme_dir=/boot/grub/themes/tinyhat
source $theme_dir/theme.cfg

if [ -n "$cpu_ok" ]; then
set th_env=
set th_disk=
regexp --set=th_disk '^([^,]+),' "$root"
if [ -n "$th_disk" -a -f "($th_disk,msdos1)/tinyhat/grubenv" ]; then
  set th_env="($th_disk,msdos1)/tinyhat/grubenv"
  load_env -f "$th_env" th_mode
  if [ -n "$th_mode" ]; then
    set default="$th_mode"
  fi
fi
if [ -z "$th_mode" ]; then
  set th_mode=stick
fi
export th_env th_mode
fi

function tinyhat {
  if [ -n "$th_env" ]; then
    save_env -f "$th_env" th_mode
  fi
  set gfxpayload=keep
  linux /boot/vmlinuz quiet loglevel=3 systemd.show_status=error rd.udev.log_level=3 tinyhat.label=TINYHAT tinyhat.persist=$th_mode
  initrd /boot/initramfs.img
}

if [ -n "$cpu_ok" ]; then
menuentry "Tiny Hat, save config to this memory stick" --id stick {
  set th_mode=stick
  tinyhat
}
menuentry "Tiny Hat, save config to this machine" --id machine {
  set th_mode=machine
  tinyhat
}
menuentry "Tiny Hat, leave no trace" --id none {
  set th_mode=none
  tinyhat
}
menuentry "Tiny Hat, safe mode" {
  set gfxpayload=keep
  linux /boot/vmlinuz tinyhat.label=TINYHAT tinyhat.persistlog memtest=4 console=ttyS0,115200 console=tty0
  initrd /boot/initramfs.img
}
fi
if [ "$grub_platform" != efi ]; then
menuentry "Memory test (Memtest86+)" {
  linux16 /boot/memtest86+/memtest.bin
}
fi
menuentry "Boot the internal hard disk" {
  if [ "$grub_platform" = efi ]; then
    exit
  fi
  set root=(hd1)
  chainloader +1
}
if [ -z "$cpu_ok" ]; then
menuentry "Power off" {
  halt
}
fi
