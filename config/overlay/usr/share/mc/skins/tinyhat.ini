# Tiny Hat: a 16-color skin for the Tokyo Night palette in foot.ini,
# on the terminal background. Based on modarcon16-defbg by Oliver Lange.

[skin]
    description = Tiny Hat
    256colors = false

[Lines]
    horiz = ─
    vert = │
    lefttop = ┌
    righttop = ┐
    leftbottom = └
    rightbottom = ┘
    topmiddle = ┬
    bottommiddle = ┴
    leftmiddle = ├
    rightmiddle = ┤
    cross = ┼
    dhoriz = ─
    dvert = │
    dlefttop = ┌
    drighttop = ┐
    dleftbottom = └
    drightbottom = ┘
    dtopmiddle = ┬
    dbottommiddle = ┴
    dleftmiddle = ├
    drightmiddle = ┤

[core]
    _default_ = color7;default
    selected = color0;color6
    marked = color11;;bold
    markselect = color0;color3;bold
    gauge = color0;color6
    input = color15;color0
    inputmark = color0;color6
    inputunchanged = color8;color0
    commandlinemark = color0;color6
    reverse = color0;color6
    header = color14;;bold
    disabled = color8;color0
    shadow = color8;color0

[dialog]
    _default_ = color7;color0
    dhotnormal = color14
    dfocus = color0;color6
    dhotfocus = color15;color6;bold
    dtitle = color14;;bold

[error]
    _default_ = color15;color1
    errdfocus = color0;color15
    errdhotnormal = color11;;bold
    errdhotfocus = color1;color15;bold
    errdtitle = color15;;bold

[filehighlight]
    directory = color12;;bold
    executable = color2
    symlink = color14
    hardlink =
    stalelink = color9
    device = color13
    special = color3
    core = color1
    temp = color8
    archive = color9
    doc = color15
    source = color6
    media = color5
    graph = color13
    database = color3

[menu]
    _default_ = color7;color0
    menusel = color0;color6
    menuhot = color14
    menuhotsel = color15;color6;bold
    menuinactive = color8

[popupmenu]
    _default_ = color7;color0
    menusel = color0;color6
    menutitle = color14;;bold

[buttonbar]
    button = color7;color0
    hotkey = color14;;bold

[statusbar]
    _default_ = color0;color6

[help]
    _default_ = color7;color0
    helpitalic = color10
    helpbold = color12;;bold
    helplink = color14
    helpslink = color0;color6
    helptitle = color14;;bold

[editor]
    _default_ = color7;default
    editbold = color15;;bold
    editmarked = color0;color6
    editwhitespace = color8
    editnonprintable = ;color0
    editlinestate = color8;color0
    bookmark = color0;color3
    bookmarkfound = color0;color2
    editrightmargin = color8;color0

[viewer]
    _default_ = color7;default
    viewbold = ;;bold
    viewunderline = ;;underline
    viewselected = color0;color6

[diffviewer]
    changedline = color0;color4
    changednew = color0;color2
    changed = color0;color6
    added = color0;color2
    removed = color0;color1
    error = color15;color1

[widget-panel]
    sort-up-char = ↑
    sort-down-char = ↓
    hiddenfiles-show-char = •
    hiddenfiles-hide-char = ○
    history-prev-item-char = «
    history-next-item-char = »
    history-show-list-char = ^

[widget-scrollbar]
    first-vert-char = ↑
    last-vert-char = ↓
    first-horiz-char = «
    last-horiz-char = »
    current-char = ■
    background-char = ▒

[widget-editor]
    window-state-char = *
    window-close-char = X
