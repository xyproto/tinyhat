title = "Tiny Hat"
help_footer = """
USB sticks and CDs show up in /media and as D: in DOSBox-X. DOS games can be placed in ~/DOS,
which is C: in DOSBox-X. A hard disk in this PC with DOS on it becomes C: and ~/DOS becomes E:."""

[windows]
layout = "float"
master_size = 0.55
master_count = 1
border = 2
gap = 6
focus_follows_mouse = false

[bar]
show = true
position = "top"

[keyboard]
layout = ""
variant = ""
options = ""
repeat_rate = 25
repeat_delay = 600

[mouse]
speed = 0.0
acceleration = true
natural_scrolling = false
left_handed = false

[touchpad]
tap_to_click = true
natural_scrolling = false
disable_while_typing = true
speed = 0.0

[[background]]
wallpaper = "/usr/share/backgrounds/tinyhat/wirehat.png"
mode = "left"
color = "1a1b26"
help = true

[[background]]
wallpaper = "/usr/share/backgrounds/tinyhat/wirehat.png"
mode = "center"
color = "1a1b26"

[[background]]
color = "000000"

[[background]]
color = "008080"

[[background]]
wallpaper = "/usr/share/backgrounds/tinyhat/hundetann.png"
mode = "tile"
color = "1a1b26"

[[background]]
wallpaper = "/usr/share/backgrounds/archlinux/small.png"
mode = "fill"
color = "1a1b26"

[[rule]]
title = "DOSBox-X"
float = true

[[rule]]
title = "ScummVM"
float = true

[[rule]]
title = "ZSNES"
float = true

[[rule]]
title = "TIC-80"
float = true

[[rule]]
title = "Tiny Hat"
float = true

[[rule]]
title = "Fasttracker II"
float = true

[[key]]
separator = true

[[key]]
hotkey = "Alt+Space"
run = "tinyhat-menu"
description = "Application Menu"

[[key]]
hotkey = "Alt+Shift+W"
action = "close"
description = "Close window (Alt+F4 also works)"

[[key]]
hotkey = "Alt+Shift+F"
action = "fullscreen"
description = "Toggle fullscreen (Alt+Enter also works in some applications)."

[[key]]
hotkey = "Alt+Tab"
action = "alttab"
arg = 1
description = "Jump between windows"

[[key]]
hotkey = "Ctrl+Alt+Up"
run = "tinyhat-volume up"
shown = "Ctrl+Alt+Up / Down"
description = "Audio volume"

[[key]]
hotkey = "Alt+F2"
run = "tinyhat-run"
description = "Run a command (Win+R also works)"

[[key]]
separator = true

[[key]]
hotkey = "Ctrl+Alt+R"
