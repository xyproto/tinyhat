# One entry per package.
#
# source: "arch" = PKGBUILD imported from the Arch Linux packaging tags,
# "arch32"/"alpine" = prebuilt package data from that distro,
# "sources" = built by Tiny Hat from package/<name>/PKGBUILD.
#
# version: exact version, "latest" (newest tag) or "main". An entry without a
# version property is only described here; its checked-in PKGBUILD is kept as is.
#
# Additional properties: a32 = archlinux32 packages repo snapshot commit
# used for i686-specific fills when importing, build = build from the
# imported PKGBUILD even if a prebuilt package is available,
# arch = "i686" when no x32 build is possible.

