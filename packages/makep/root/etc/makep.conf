set -q PACKAGER; or set -gx PACKAGER 'Tiny Hat <https://github.com/xyproto/tinyhat>'

function makep_triplet -a arch
    switch $arch
        case i686
            echo i686-pc-linux-gnu
        case x32
            echo x86_64-pc-linux-gnux32
        case x86_64
            echo x86_64-pc-linux-gnu
        case aarch64
            echo aarch64-unknown-linux-gnu
        case '*'
            return 1
    end
end

set -g makep_options strip !docs !libtool !staticlibs emptydirs zipman purge !debug !lto
set -g makep_doc_dirs usr/doc usr/local/doc usr/share/doc usr/local/share/doc usr/gtk-doc usr/local/gtk-doc usr/share/gtk-doc usr/local/share/gtk-doc

function makep_flags -a arch flavour
    set -l march
    switch $arch
        case i686
            set march -march=i686 -mtune=generic
        case x32 x86_64
            set march -march=x86-64 -mtune=generic
        case aarch64
            set march -march=armv8-a -mtune=cortex-a72
        case '*'
            return 1
    end
    if test "$flavour" = arch
        set -q CFLAGS; or set -gx CFLAGS $march -O2 -pipe -fno-plt -fexceptions -Wp,-D_FORTIFY_SOURCE=3 -Wformat -Werror=format-security -fstack-clash-protection
        set -q CXXFLAGS; or set -gx CXXFLAGS $CFLAGS -Wp,-D_GLIBCXX_ASSERTIONS
        set -q LDFLAGS; or set -gx LDFLAGS -Wl,-O1 -Wl,--sort-common -Wl,--as-needed -Wl,-z,relro -Wl,-z,now -Wl,-z,pack-relative-relocs
    else
        set -q CFLAGS; or set -gx CFLAGS $march -Os -pipe -fno-plt -fno-asynchronous-unwind-tables -ffunction-sections -fdata-sections
        set -q CXXFLAGS; or set -gx CXXFLAGS $CFLAGS
        set -q LDFLAGS; or set -gx LDFLAGS -Wl,-O1,--sort-common,--as-needed,-z,relro,-z,now,-z,pack-relative-relocs,--gc-sections
    end
    set -q LTOFLAGS; or set -gx LTOFLAGS -flto=auto
    set -q MAKEFLAGS; or set -gx MAKEFLAGS -j(nproc)
end
