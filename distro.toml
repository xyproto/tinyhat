name = "Tiny Hat"
hat_color = "#922424"
hat_highlight_color = "#f7768e"

# Built as x32 for tinyhat64x32.img; everything else in that image is the i686 version.
# Empty until the x32 toolchain (x32-gcc-stage1, glibc, x32-gcc) builds; the core set was:
# glibc x32-runtime zlib zstd xz bzip2 libffi expat
x32 = []

[deny]
# image: never in an image (checked when the package lists are worked out, when updates are
# considered and in the finished root filesystems). Patterns, or NAME<VERSION for versions that are too old.
# everywhere: never built, installed or used as a build dependency either.
# files: no root filesystem may contain these, whichever package they come from.
image = [
    "openssl<4", "openssl-3",
    "perl", "perl-*",
    "sdl2-*", "sdl2_*",
    "guile", "portaudio", "libheif", "libavif", "libjxl",
    # xfsprogs reads its configuration with Tiny Hat's TOML patch instead
    "libinih",
    "gtk2-*",
    "gtk3-*",
    "qt4", "qt4-*", "qt5-*", "qt6-*", "python-pyqt*", "pyside*",
    "xorg-server*", "xorg-x*", "libxext", "libxrender", "libxrandr", "libxi", "libxinerama", "libxcursor",
    "libxfixes", "libxdamage", "libxcomposite", "libxtst", "libxss", "libxv", "libxpresent", "libxxf86vm",
    "libxkbcommon-x11", "libxt", "libxmu", "libxaw", "libxpm", "libxft", "libsm", "libice",
    "xcb-util", "xcb-util-cursor", "xcb-util-errors", "xcb-util-image", "xcb-util-keysyms", "xcb-util-renderutil",
    "qt5-base", "qt6-base", "sdl2_image",
    # Older than the LLVM that Arch Linux uses. Prebuilt ones are built from packages/llvm instead (scripts/build_planner.py)
    "llvm<23", "llvm-libs<23", "clang<23", "llvm[0-9]*<23", "clang[0-9]*<23",
    "tk", "tk[0-9]*",
    "python<3.14",
]
everywhere = [
    "appstream",
    "at-spi2-core",
    # The initramfs runs tinyhat-mountroot, and the shells are bash and fish
    "busybox",
    "ffmpeg",
    "gstreamer",
    "gtk2",
    "gtk3",
    "gtkmm",
    "libglade",
    "librsvg",
    "npm",
    "opencv",
    "python2",
    "sdl12-compat",
    "sdl2",
    "vala",
    "vte3",
    "wpewebkit",
]
files = [
    "usr/lib/libQt5Core.so*", "usr/lib/libQt6Core.so*", "usr/bin/perl", "usr/lib/libSDL2-2.0.so*",
    "usr/lib/libSDL2_image*.so*", "usr/lib/libgtk-x11-2.0.so*", "usr/lib/libgtk-3.so*",
    "usr/lib/python2*", "usr/lib/python3.[0-9]", "usr/lib/python3.1[0-3]", "usr/lib/libtk[0-9]*.so*",
]

[image-orbiton]
# tinyhat32.img while it is built only from our own TINYBUILDs (scripts/mkimg-orbiton.sh): what it takes to boot GRUB,
# Linux and Orbiton. These and everything they need are built for i686 in the x86_64 build environment, with the
# i686-cross toolchain ("make cross")
packages = [
    "filesystem", "glibc", "bash", "coreutils", "util-linux", "systemd", "kmod", "kbd", "orbiton", "tinyhat-system",
    "grep", "nawk", "sed", "xfsprogs", "findutils", "linux-tinyhat",
]
# Built for the boot medium, not installed in the root file system: GRUB and its menu entries (memtest86+, FreeDOS via
# syslinux's memdisk), CPU microcode, and what the initramfs runs
boot = [
    "grub", "syslinux", "memtest86+", "tinyhat-freedos", "amd-ucode", "intel-ucode", "tinyhat-mountroot",
    "tinyhat-splash", "tinyhat-guru",
]

