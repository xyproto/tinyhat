# Packages: [name] tables. source = "arch" (the default) imports the PKGBUILD from the
# Arch Linux packaging repos at the version recorded in distro.lock; "sources" means
# packages/<name>/PKGBUILD is Tiny Hat's own. A version here pins the import; a recipe
# with no version anywhere is maintained by hand and never re-imported.
# build_from_source = true builds even if a prebuilt package exists; build_for lists the
# targets an imported recipe is built for (default ["i686", "x32"]); skip_for_now = true
# leaves the recipe out of everything; pin* picks the archlinux32 package used in the
# build environment. Dependencies belong in the PKGBUILD: a build gets the local version
# of each dependency that is built from source or that the seed lacks or has broken.

