name = "Tiny Hat"
hat_color = "#922424"
hat_highlight_color = "#f7768e"

# Packages are taken prebuilt from archlinux32 when possible, unless a package below
# has build = true or archlinux32 lacks it or ships it broken. prebuilt = true marks
# the slow ones (more than about 15 minutes to build) that should stay prebuilt.
prebuilt_all = true

# Built as x32 for tinyhat64x32.img; everything else in that image is the i686 version.
# Empty until the x32 toolchain (x32-gcc-stage1, glibc, x32-gcc) builds; the core set was:
# glibc x32-runtime zlib zstd xz bzip2 libffi expat
x32 = []

