[image-x32]
# The 64-bit x86 image with 32-bit pointers (tinyhat64x32.img): [image] packages with these changes.
add = ["tinyhat-steam"]

[image-aarch64]
# The 64-bit ARM images: [image] packages with these changes, plus the uefi packages for the UEFI
# image (tinyhat-aarch64.img) or the rpi4 packages for the Raspberry Pi 4 image (tinyhat-rpi4.img).
# Everything is built from our TINYBUILDs; only the build environment comes prebuilt from Arch Linux ARM
add = ["archlinuxarm-keyring"]
uefi = []
rpi4 = ["raspberrypi-bootloader", "firmware-raspberrypi"]
# Built for the boot partition and the initramfs, not installed in the root file system
boot = ["linux-tinyhat", "grub", "tinyhat-mountroot", "tinyhat-splash", "tinyhat-boot-animations"]
# Added to the build environment, which otherwise has what the built PKGBUILDs and TINYBUILDs need
buildroot = ["go", "distcc"]
# The firmware, kernel and device trees go on the FAT boot partition instead
exclude = ["boot"]
remove = [
    "archlinux32-keyring", "archlinux-keyring", "tinyhat-wine", "virtualbox-guest-utils-nox",
    "libresprite",
    # PC hardware
    "linux-firmware-radeon", "linux-firmware-intel", "linux-firmware-amdgpu", "linux-firmware-cirrus",
    "linux-firmware-nvidia", "sof-firmware",
]

[image-x86_64]
# The 64-bit x86 image (tinyhat64.img): [image] packages with these changes. It boots the 64-bit kernel and the
# initramfs of tinyhat64x32.img. Everything is built from our TINYBUILDs; only the build environment comes prebuilt
# from Arch Linux
remove = ["archlinux32-keyring"]
# Built for the boot partition, not installed in the root file system
boot = ["linux-tinyhat"]
# Added to the build environment, which otherwise has what the built PKGBUILDs and TINYBUILDs need. python-sphinx:
# sphinx-build for the i686 build environment ([buildroot] host_python_tools), and the other build programs that it
# takes from here ([buildroot] host_tools)
buildroot = [
    "go", "python-sphinx", "doxygen", "xorg-bdftopcf", "xorg-xcursorgen", "gtk-update-icon-cache", "sequoia-sq",
    "yasm",
]

[buildroot]
# The i686 build environment (build/buildroot), from our own builds only: what "make cross" builds from these, with
# what they need at run time. Everything else that a build needs comes from its TINYBUILD (depends, makedepends).
# Perl is banned from Tiny Hat, so what only runs at build time (perl, autoconf, automake...) is the x86_64 build
# environment's, at /host (host_tools, host_dirs, scripts/mkbuildroot.sh). So is the shell that runs the builds (bash,
# as for the cross builds)
i686 = [
    "filesystem", "glibc", "gcc", "binutils", "coreutils", "sed", "grep", "gawk", "nawk", "findutils",
    "tar", "gzip", "xz", "zstd", "bzip2", "diffutils", "patch", "which", "util-linux", "file", "make", "pkgconf",
    "libtool", "m4", "bison", "flex", "gettext", "ccache", "metatar", "libarchive",
    "libatomic",
]
# Programs of the x86_64 build environment that the i686 one runs (linked in /usr/bin), and the directories they use
host_tools = [
    "sh", "bash", "perl", "autoconf", "autoheader", "autom4te", "autoreconf", "autoscan", "autoupdate", "ifnames",
    "automake",
    "aclocal", "help2man", "intltoolize", "intltool-extract", "intltool-merge", "intltool-prepare", "intltool-update",
    "fish", "fish_indent", "git", "curl", "pacman",
    "gperf", "re2c", "jq", "doxygen", "sassc", "xa", "bdftopcf", "xcursorgen", "gtk-update-icon-cache", "yasm",
    "sq",
]
# Python programs of the x86_64 build environment that the i686 one runs, through its own Python (with its own modules,
# so that they do not mix with the i686 Python): sphinx-build makes fish's help pages
host_python_tools = ["sphinx-build"]
# The build tools of host_tools that builds never get as a dependency (curl and pacman are not here: their packages
# have the libraries that builds link with, libcurl and libalpm)
provided = ["sh", "bash", "git", "fish", "intltool"]
host_dirs = [
    "usr/bin/core_perl", "usr/bin/vendor_perl", "usr/bin/site_perl", "usr/share/perl5", "usr/lib/perl5",
    "usr/share/autoconf", "usr/share/automake-*", "usr/share/aclocal-*", "usr/share/intltool", "usr/share/fish",
    "usr/lib/git-core", "usr/share/git-core", "etc/ssl", "etc/ca-certificates",
    # The Go that go-tinyhat bootstraps from (no go in PATH: it would build x86_64 programs)
    "usr/lib/go",
]
# The x86_64 and aarch64 build environments: prebuilt from Arch Linux (ARM)
packages = [
    "filesystem", "bash", "coreutils", "sed", "grep", "gawk", "findutils", "tar", "gzip", "xz", "zstd", "bzip2",
    "diffutils", "patch", "which", "util-linux", "file", "dosfstools", "mtools",
    "squashfs-tools", "xfsprogs", "libisoburn", "qemu-img", "elfkickers",
    "gcc", "binutils", "make", "uthash", "gperf", "pkgconf", "autoconf", "automake", "libtool", "cmake", "meson",
    "ninja", "nasm", "ccache", "python", "linux-api-headers", "bison", "m4",
    "wayland", "wayland-protocols", "libglvnd", "mesa", "libxkbcommon", "libinput", "pixman", "libdrm", "seatd",
    "hwdata", "fcft", "tllist", "cairo", "pam", "scdoc",
    "alsa-lib", "pipewire", "libpng", "zlib", "freetype2", "libslirp", "ncurses", "libsndfile",
    "a52dec", "faad2", "libmad", "libmpeg2", "giflib", "fribidi", "libtheora", "libvorbis", "flac", "libjpeg-turbo",
    "libmikmod",
    "grub",
    "arm-none-eabi-binutils", "arm-none-eabi-gcc", "arm-none-eabi-newlib",
    "expat", "gdbm", "libffi", "libnsl", "libxcrypt", "openssl", "tzdata", "mpdecimal", "sqlite", "libxml2",
    "libxslt", "libyaml",
]
# Built from our PKGBUILDs and TINYBUILDs, over the prebuilt packages: Python 3.14, and the same fish 4 that the TINYBUILDs
# are run with on x86_64 and aarch64 (the prebuilt one is fish 3, where ? is still a wildcard)
local = ["python", "cython", "python-markupsafe", "python-lxml", "fish"]
prefer_built = ["gtk4"]
exclude = ["usr/lib/python3.1[0-3]", "usr/bin/python3.1[0-3]*", "usr/lib/libpython3.1[0-3]*"]
i686_skip = [
