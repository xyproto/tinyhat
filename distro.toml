# Packages: [name] tables. Every package directory has a TINYBUILD. source = "arch" (the default)
# means the TINYBUILD was ported from Arch's PKGBUILD at the version recorded in distro.lock, and
# follows Arch's updates (importpkg.py update); "sources" means it is Tiny Hat's own. A version here
# pins the Arch version; a package directory with no version anywhere is maintained by hand.
# build_from_source = true builds even if a prebuilt package exists; skip_for_now = true
# leaves the package directory out of everything; pin* picks the archlinux32 package used in the
# build environment. Dependencies belong in the TINYBUILD: a build gets the local version
# of each dependency that is built from source or that the seed lacks or has broken.

[abcmidi]
build_from_source = true

