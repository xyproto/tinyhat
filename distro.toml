[image-aarch64]
# The 64-bit ARM images: [image] packages with these changes, plus the uefi packages for the UEFI
# image (tinyhat-aarch64.img) or the rpi4 packages for the Raspberry Pi 4 image (tinyhat-rpi4.img).
# Packages come prebuilt from Arch Linux ARM, except the recipes that "make lock-aarch64" decides to build
add = ["archlinuxarm-keyring"]
uefi = ["linux-aarch64"]
rpi4 = ["linux-rpi", "raspberrypi-bootloader", "firmware-raspberrypi"]
# Built for the initramfs
build_from_source = ["busybox", "tinyhat-splash"]
# Added to the build environment, which otherwise has what the built recipes need
buildroot = ["go", "distcc"]
# The firmware, kernel and device trees go on the FAT boot partition instead
exclude = ["boot"]
remove = [
    "archlinux32-keyring", "archlinux-keyring",
    # PC hardware
    "linux-firmware-radeon", "linux-firmware-intel",
    # Not in Arch Linux ARM yet (the arm-none-eabi toolchain for GBA development)
    "arm-none-eabi-binutils", "arm-none-eabi-gcc", "arm-none-eabi-newlib", "gba-dev",
]

[buildroot]
packages = [
    "filesystem", "bash", "coreutils", "sed", "grep", "gawk", "findutils", "tar", "gzip", "xz", "zstd", "bzip2", "diffutils", "patch", "which", "util-linux", "file", "dosfstools", "mtools",
    "gcc", "binutils", "make", "uthash", "gperf", "pkgconf", "autoconf", "automake", "libtool", "cmake", "meson", "ninja", "nasm", "ccache", "python", "linux-api-headers", "bison", "m4",
    "wayland", "wayland-protocols", "libglvnd", "mesa", "libxkbcommon", "libinput", "pixman", "libdrm", "seatd", "hwdata", "fcft", "tllist", "cairo", "pam", "scdoc",
    "alsa-lib", "pipewire", "libpng", "zlib", "freetype2", "libslirp", "ncurses", "libsndfile", "libxml2-legacy",
    "a52dec", "faad2", "libmad", "libmpeg2", "giflib", "fribidi", "libtheora", "libvorbis", "flac", "libjpeg-turbo", "libmikmod",
    "grub",
    "arm-none-eabi-binutils", "arm-none-eabi-gcc", "arm-none-eabi-newlib",
